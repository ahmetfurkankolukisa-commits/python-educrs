# ================================================================ misconceptions
# detect: behavioral = matches a known-wrong program on all tests
#         ast        = code pattern
#         exception  = specific error + context
#         predict    = taught/diagnosed with predict-output exercises

[[misconception]]
id = "mc.assign-vs-equals"
concepts = ["cond.if"]
belief = "= compares values (if x = 5:)."
detect = "exception"

[[misconception]]
id = "mc.vars-auto-update"
concepts = ["vars.reassign"]
belief = "After b = a + 1, changing a later also changes b."
detect = "predict"

[[misconception]]
id = "mc.var-remembers-history"
concepts = ["vars.reassign"]
belief = "A variable keeps all the values it was ever given."
detect = "predict"

[[misconception]]
id = "mc.quoted-name"
concepts = ["vars.use"]
belief = "print('name') prints the value of the variable name."
detect = "behavioral"

[[misconception]]
id = "mc.input-is-number"
concepts = ["io.input-number"]
belief = "input() returns a number when the user types digits."
detect = "exception"

[[misconception]]
id = "mc.int-division"
concepts = ["numbers.float"]
belief = "/ between two ints gives an int."
detect = "predict"

[[misconception]]
id = "mc.float-exact"
concepts = ["numbers.float-precision"]
belief = "Floats are always exact, so 0.1 + 0.2 == 0.3."
detect = "predict"

[[misconception]]
id = "mc.or-english"
concepts = ["bool.and-or-not"]
belief = "if x == 1 or 2: checks whether x is 1 or 2."
detect = "ast"

[[misconception]]
id = "mc.elif-all-run"
concepts = ["cond.elif"]
belief = "Every true branch of an if/elif chain runs."
detect = "predict"

[[misconception]]
id = "mc.indentation-cosmetic"
concepts = ["blocks.indentation"]
belief = "Indentation is only for looks; a line's block doesn't change behaviour."
detect = "behavioral"

[[misconception]]
id = "mc.loop-update-missing"
concepts = ["loops.while", "loops.infinite"]
belief = "A while loop stops by itself eventually."
detect = "ast"

[[misconception]]
id = "mc.range-inclusive"
concepts = ["loops.range"]
belief = "range(1, 5) includes 5."
detect = "behavioral"

[[misconception]]
id = "mc.accumulator-reset"
concepts = ["loops.accumulator"]
belief = "The total can be set to 0 inside the loop."
detect = "behavioral"

[[misconception]]
id = "mc.loop-var-control"
concepts = ["loops.range"]
belief = "Changing the loop variable inside a for loop changes which items are visited."
detect = "predict"

[[misconception]]
id = "mc.index-starts-at-1"
concepts = ["lists.index"]
belief = "The first item is items[1]."
detect = "behavioral"

[[misconception]]
id = "mc.aliasing-copies"
concepts = ["lists.aliasing"]
belief = "b = a makes a separate copy of the list."
detect = "predict"

[[misconception]]
id = "mc.sort-returns-list"
concepts = ["lists.sorted-vs-sort"]
belief = "items = items.sort() gives back the sorted list."
detect = "ast"

[[misconception]]
id = "mc.string-mutable"
concepts = ["strings.immutable"]
belief = "s.upper() changes s, or s[0] = 'H' works."
detect = "ast"

[[misconception]]
id = "mc.dict-positional"
concepts = ["dicts.basic"]
belief = "d[0] gives the first entry of a dictionary."
detect = "exception"

[[misconception]]
id = "mc.def-runs-function"
concepts = ["funcs.def"]
belief = "Defining a function runs its body."
detect = "behavioral"

[[misconception]]
id = "mc.params-via-input"
concepts = ["funcs.params"]
belief = "A function should get its values with input() instead of parameters."
detect = "ast"

[[misconception]]
id = "mc.print-vs-return"
concepts = ["funcs.print-vs-return"]
belief = "Printing a value inside a function is the same as returning it."
detect = "behavioral"

[[misconception]]
id = "mc.return-in-loop"
concepts = ["funcs.early-return"]
belief = "return False in an else inside the loop is fine for 'none of the items'."
detect = "behavioral"

[[misconception]]
id = "mc.local-visible-outside"
concepts = ["scope.local"]
belief = "Variables created in a function exist after it returns."
detect = "exception"

[[misconception]]
id = "mc.assign-global"
concepts = ["scope.global"]
belief = "Assigning to a name inside a function changes the global one."
detect = "exception"

[[misconception]]
id = "mc.mutable-default"
concepts = ["funcs.mutable-default"]
belief = "A default list starts fresh on every call."
detect = "predict"

[[misconception]]
id = "mc.bare-except"
concepts = ["errors.specific"]
belief = "A bare except is a safe way to handle errors."
detect = "ast"

[[misconception]]
id = "mc.file-read-twice"
concepts = ["files.read"]
belief = "Calling read() twice returns the content twice."
detect = "predict"

[[misconception]]
id = "mc.self-missing"
concepts = ["oop.methods"]
belief = "Methods don't need self as their first parameter."
detect = "exception"

[[misconception]]
id = "mc.is-vs-equals"
concepts = ["oop.state"]
belief = "is and == mean the same thing."
detect = "predict"

[[misconception]]
id = "mc.recursion-no-base"
concepts = ["rec.basic"]
belief = "A recursive function stops on its own."
detect = "exception"

[[misconception]]
id = "mc.generator-reusable"
concepts = ["gen.basic"]
belief = "A generator can be looped over again and again."
detect = "predict"

